                - pattern: ^(0|[1-9][0-9]*)$
            revision:
              type: string
              allOf:
                - minLength: 1
                  maxLength: 4
                - pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
                - pattern: ^(0|[1-9][0-9]*)$
            creator:
              $ref: '#/components/schemas/Reference'
            createdAt:
              type: string
              pattern: ^-?(([1-9][0-9][0-9][0-9]+)|(0[0-9][0-9][0-9]))-((0[1-9])|(1[0-2]))-((0[1-9])|([12][0-9])|(3[01]))T(((([01][0-9])|(2[0-3])):[0-5][0-9]:([0-5][0-9])(\.[0-9]+)?)|24:00:00(\.0+)?)(Z|\+00:00|-00:00)$
            updatedAt:
              type: string
              pattern: ^-?(([1-9][0-9][0-9][0-9]+)|(0[0-9][0-9][0-9]))-((0[1-9])|(1[0-2]))-((0[1-9])|([12][0-9])|(3[01]))T(((([01][0-9])|(2[0-3])):[0-5][0-9]:([0-5][0-9])(\.[0-9]+)?)|24:00:00(\.0+)?)(Z|\+00:00|-00:00)$
            templateId:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
              maxLength: 2048
    Identifiable:
      allOf:
        - $ref: '#/components/schemas/Referable'
        - required:
            - id
          properties:
            administration:
              $ref: '#/components/schemas/AdministrativeInformation'
            id:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
              maxLength: 2048
    AssetKind:
      type: string
      enum:
        - Batch
        - Instance
        - NotApplicable
        - Role
        - Type
    SpecificAssetId:
      allOf:
        - $ref: '#/components/schemas/HasSemantics'
        - required:
            - name
            - value
          properties:
            name:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
              maxLength: 64
            value:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
              maxLength: 2048
            externalSubjectId:
              $ref: '#/components/schemas/Reference'
    Resource:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          allOf:
            - minLength: 1
