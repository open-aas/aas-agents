openapi: 3.1.0
info:
  title: DotAAS Part 2 | HTTP/REST | Entire API Collection
  description: |-
    All APIs of the Specification of the [Specification of the Asset Administration Shell: Part 2](https://industrialdigitaltwin.org/en/content-hub/aasspecifications) in one collection. Please not that this API is not intended to generate productive code but only for overview purposes.  
    Copyright: Industrial Digital Twin Association (IDTA) 2025
  contact:
    name: Industrial Digital Twin Association (IDTA)
    email: info@idtwin.org
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  version: V3.2.0
  termsOfService: https://github.com/admin-shell-io/aas-specs-metamodel
servers:
  - url: https://admin-shell.io/api/v3/
  - url: https://example.com/
paths:
  /aas:
    get:
      tags:
        - Asset Administration Shell API
      summary: Returns a specific Asset Administration Shell
      operationId: GetAssetAdministrationShell
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetAssetAdministrationShell/3/2
      responses:
        '200':
          description: Requested Asset Administration Shell
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetAdministrationShell'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
    put:
      tags:
        - Asset Administration Shell API
      summary: Creates or updates an existing Asset Administration Shell
      operationId: PutAssetAdministrationShell
      x-semanticIds:
        - https://admin-shell.io/aas/API/PutAssetAdministrationShell/3/2
      requestBody:
        description: Asset Administration Shell object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetAdministrationShell'
        required: true
      responses:
        '201':
          description: Asset Administration Shell created successfully
        '204':
          description: Asset Administration Shell updated successfully
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
  /aas/$reference:
    get:
      tags:
        - Asset Administration Shell API
      summary: Returns a specific Asset Administration Shell as a Reference
      operationId: GetAssetAdministrationShell-Reference
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetAssetAdministrationShel/3/2
      responses:
        '200':
          description: Requested Asset Administration Shell
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reference'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
  /aas/asset-information:
    get:
      tags:
        - Asset Administration Shell API
      summary: Returns the Asset Information
      operationId: GetAssetInformation
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetAssetInformation/3/2
      responses:
        '200':
          description: Requested Asset Information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetInformation'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
    put:
      tags:
        - Asset Administration Shell API
      summary: Updates the Asset Information
      operationId: PutAssetInformation
      x-semanticIds:
        - https://admin-shell.io/aas/API/PutAssetInformation/3/2
      requestBody:
        description: Asset Information object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInformation'
        required: true
      responses:
        '204':
          description: Asset Information updated successfully
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
  /aas/asset-information/thumbnail:
    get:
      tags:
        - Asset Administration Shell API
      operationId: GetThumbnail
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetThumbnail/3/2
      responses:
        '200':
          description: The thumbnail of the Asset Information.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
    put:
      tags:
        - Asset Administration Shell API
      operationId: PutThumbnail
      x-semanticIds:
        - https://admin-shell.io/aas/API/PutThumbnail/3/2
      requestBody:
        description: Thumbnail to upload
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Binary content. A source filename, if supplied, is conveyed in the `filename` parameter of this part's `Content-Disposition` header.
              required:
                - file
            encoding:
              file:
                contentType: application/octet-stream
        required: true
      responses:
        '204':
          description: Thumbnail updated successfully
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
    delete:
      tags:
        - Asset Administration Shell API
      operationId: DeleteThumbnail
      x-semanticIds:
        - https://admin-shell.io/aas/API/DeleteThumbnail/3/2
      responses:
        '200':
          description: 'Thumbnail deletion successful.  Deprecated: Use response code 204 instead.'
        '204':
          $ref: '#/components/responses/no-content'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
  /aas/submodel-refs:
    get:
      tags:
        - Asset Administration Shell API
      summary: Returns all submodel references
      operationId: GetAllSubmodelReferences
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetAllSubmodelReferences/3/2
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Requested submodel references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReferencesResult'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
    post:
      tags:
        - Asset Administration Shell API
      summary: Creates a submodel reference at the Asset Administration Shell
      operationId: PostSubmodelReference
      x-semanticIds:
        - https://admin-shell.io/aas/API/PostSubmodelReference/3/2
      requestBody:
        description: Reference to the Submodel
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reference'
        required: true
      responses:
        '201':
          description: Submodel reference created successfully
          headers:
            Location:
              description: URL of the newly created resource
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reference'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
  /aas/submodel-refs/{submodelIdentifier}:
    parameters:
      - $ref: '#/components/parameters/SubmodelIdentifier'
    delete:
      tags:
        - Asset Administration Shell API
      summary: Deletes the submodel reference from the Asset Administration Shell. Does not delete the submodel itself!
      operationId: DeleteSubmodelReference
      x-semanticIds:
        - https://admin-shell.io/aas/API/DeleteSubmodelReference/3/2
      responses:
        '204':
          description: Submodel reference deleted successfully
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
  /aas/submodels/{submodelIdentifier}:
    parameters:
      - $ref: '#/components/parameters/SubmodelIdentifier'
    get:
      tags:
        - Asset Administration Shell API
      summary: Returns the Submodel
      operationId: GetSubmodelById_AAS
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetSubmodelById/3/2
      parameters:
        - $ref: '#/components/parameters/Level'
        - $ref: '#/components/parameters/Extent'
      responses:
        '200':
          description: Requested Submodel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submodel'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
    put:
      tags:
        - Asset Administration Shell API
      summary: Updates the Submodel
      operationId: PutSubmodelById_AAS
      x-semanticIds:
        - https://admin-shell.io/aas/API/PutSubmodelById/3/2
      parameters:
        - name: level
          in: query
          description: Determines the structural depth of the respective resource content
          required: false
          schema:
            type: string
            default: deep
            enum:
              - deep
      requestBody:
        description: Submodel object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Submodel'
        required: true
      responses:
        '204':
          description: Submodel updated successfully
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
    patch:
      tags:
        - Asset Administration Shell API
      summary: Updates the Submodel
      operationId: PatchSubmodelById_AAS
      x-semanticIds:
        - https://admin-shell.io/aas/API/PatchSubmodelById/3/2
      parameters:
        - name: level
          in: query
          description: Determines the structural depth of the respective resource content
          required: false
          schema:
            type: string
            default: core
            enum:
              - core
      requestBody:
        description: Submodel object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Submodel'
        required: true
      responses:
        '204':
          description: Submodel updated successfully
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
    delete:
      tags:
        - Asset Administration Shell API
      summary: Deletes the submodel from the Asset Administration Shell.
      operationId: DeleteSubmodelById_AAS
      x-semanticIds:
        - https://admin-shell.io/aas/API/DeleteSubmodelById/3/2
      responses:
        '204':
          description: Submodel deleted successfully
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
  /aas/submodels/{submodelIdentifier}/$metadata:
    parameters:
      - $ref: '#/components/parameters/SubmodelIdentifier'
    get:
      tags:
        - Asset Administration Shell API
      summary: Returns the Submodel's metadata elements
      operationId: GetSubmodelById-Metadata_AAS
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetSubmodelById/3/2
      responses:
        '200':
          description: Requested Submodel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmodelMetadata'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
    patch:
      tags:
        - Asset Administration Shell API
      summary: Updates the metadata attributes of the Submodel
      operationId: PatchSubmodeByIdMetadata_AAS
      x-semanticIds:
        - https://admin-shell.io/aas/API/PatchSubmodelById/3/2
      parameters:
        - name: level
          in: query
          description: Determines the structural depth of the respective resource content
          required: false
          schema:
            type: string
            default: core
            enum:
              - core
      requestBody:
        description: Submodel object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmodelMetadata'
        required: true
      responses:
        '204':
          description: Submodel updated successfully
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
  /aas/submodels/{submodelIdentifier}/$value:
    parameters:
      - $ref: '#/components/parameters/SubmodelIdentifier'
    get:
      tags:
        - Asset Administration Shell API
      summary: Returns the Submodel's ValueOnly representation
      operationId: GetSubmodelById-ValueOnly_AAS
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetSubmodelById/3/2
      parameters:
        - $ref: '#/components/parameters/Level'
        - $ref: '#/components/parameters/Extent'
      responses:
        '200':
          description: Requested Submodel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueOnly'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
    patch:
      tags:
        - Asset Administration Shell API
      summary: Updates the values of the Submodel
      operationId: PatchSubmodelById-ValueOnly_AAS
      x-semanticIds:
        - https://admin-shell.io/aas/API/PatchSubmodelById/3/2
      parameters:
        - name: level
          in: query
          description: Determines the structural depth of the respective resource content
          required: false
          schema:
            type: string
            default: core
            enum:
              - core
      requestBody:
        description: Submodel object in the ValueOnly representation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueOnly'
        required: true
      responses:
        '204':
          description: Submodel updated successfully
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
  /aas/submodels/{submodelIdentifier}/$reference:
    parameters:
      - $ref: '#/components/parameters/SubmodelIdentifier'
    get:
      tags:
        - Asset Administration Shell API
      summary: Returns the Submodel as a Reference
      operationId: GetSubmodelById-Reference_AAS
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetSubmodelById/3/2
      parameters:
        - name: level
          in: query
          description: Determines the structural depth of the respective resource content
          required: false
          deprecated: true
          schema:
            type: string
            default: core
            enum:
              - core
      responses:
        '200':
          description: Requested Submodel as a Reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reference'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
  /aas/submodels/{submodelIdentifier}/$path:
    parameters:
      - $ref: '#/components/parameters/SubmodelIdentifier'
    get:
      tags:
        - Asset Administration Shell API
      summary: Returns the Submodel's metadata elements
      operationId: GetSubmodelById-Path_AAS
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetSubmodelById/3/2
      parameters:
        - $ref: '#/components/parameters/Level'
      responses:
        '200':
          description: Requested Submodel in Path notation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PathItem'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
  /aas/submodels/{submodelIdentifier}/submodel-elements:
    parameters:
      - $ref: '#/components/parameters/SubmodelIdentifier'
    get:
      tags:
        - Asset Administration Shell API
      summary: Returns all submodel elements including their hierarchy
      operationId: GetAllSubmodelElements_AAS
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetAllSubmodelElements/3/2
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Level'
        - $ref: '#/components/parameters/Extent'
      responses:
        '200':
          description: List of found submodel elements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubmodelElementsResult'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
    post:
      tags:
        - Asset Administration Shell API
      summary: Creates a new submodel element
      operationId: PostSubmodelElement_AAS
      x-semanticIds:
        - https://admin-shell.io/aas/API/PostSubmodelElement/3/2
      requestBody:
        description: Requested submodel element
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmodelElement'
        required: true
      responses:
        '201':
          description: Submodel element created successfully
          headers:
            Location:
              description: URL of the newly created resource
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmodelElement'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
  /aas/submodels/{submodelIdentifier}/submodel-elements/$metadata:
    parameters:
      - $ref: '#/components/parameters/SubmodelIdentifier'
    get:
      tags:
        - Asset Administration Shell API
      summary: Returns all submodel elements including their hierarchy
      operationId: GetAllSubmodelElements-Metadata_AAS
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetAllSubmodelElements/3/2
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: List of found submodel elements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubmodelElementsMetadataResult'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
        default:
          $ref: '#/components/responses/default'
  /aas/submodels/{submodelIdentifier}/submodel-elements/$value:
    parameters:
      - $ref: '#/components/parameters/SubmodelIdentifier'
    get:
      tags:
        - Asset Administration Shell API
      summary: Returns all submodel elements including their hierarchy in the ValueOnly representation
      operationId: GetAllSubmodelElements-ValueOnly_AAS
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetAllSubmodelElements/3/2
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Level'
        - $ref: '#/components/parameters/Extent'
      responses:
        '200':
          description: List of found submodel elements in their ValueOnly representation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubmodelElementsValueResult'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
